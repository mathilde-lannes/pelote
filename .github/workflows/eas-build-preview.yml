# Staging/preview EAS build — manual or on GitHub release.
# Requires GitHub secrets EXPO_TOKEN and EAS_PROJECT_ID (same UUID must also
# exist in the EAS preview environment so remote app.config evaluation works).
# Optional: EXPO_ACCOUNT_OWNER.

name: EAS Preview Build (Android & iOS)

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  Build:
    name: EAS Preview Build
    runs-on: ubuntu-latest
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret. Learn more: https://docs.expo.dev/eas-update/github-actions"
            exit 1
          fi

      - name: 📦 Checkout project repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      - name: ⏱️ EAS Build
        uses: ./.github/actions/eas-build
        with:
          APP_ENV: preview
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
          EXPO_ACCOUNT_OWNER: ${{ secrets.EXPO_ACCOUNT_OWNER || 'pelote' }}
          VERSION: ${{ github.event.release.tag_name || github.sha }}
          ANDROID: 'true'
          IOS: 'false'
